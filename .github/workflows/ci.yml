name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://majestic-sturgeon-687.eu-west-1.convex.cloud
      KRITO_BACKEND_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The pdf report tests read the rendered text with pdftotext (poppler).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/buildVercel.ts
      - run: npx tsx scripts/checkPrerender.ts
